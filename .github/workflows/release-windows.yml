name: Release Windows

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Existing draft candidate tag: test the accepted installer without rebuilding it"
        required: false
        type: string
      expected_sha256:
        description: "SHA-256 of the exact locally accepted candidate installer"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.candidate_tag == ''
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/workspace/runtime/playwright-browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install uv==0.12.22
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m playwright install chromium
          .\.venv\Scripts\python.exe -c "from pathlib import Path; from app.runtime_packs import RuntimePackManager; RuntimePackManager(Path('runtime-packs.json'), Path('workspace/runtime')).install('ffmpeg-essentials-windows-x64')"
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\.venv\Scripts"
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\workspace\runtime\ffmpeg"
          $env:PATH = "$env:GITHUB_WORKSPACE\workspace\runtime\ffmpeg;$env:PATH"
          node --test scripts/cf_worker_security.test.mjs
          Push-Location web
          npm ci
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
          node node_modules/typescript/bin/tsc --noEmit
          npm run build
          Pop-Location
          .\.venv\Scripts\python.exe -m unittest discover -s tests -p "test_*.py"

      - name: Build Windows installers
        shell: pwsh
        run: .\scripts\build_desktop.ps1

      - name: Collect release assets and hashes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $installers = @(Get-ChildItem web\src-tauri\target\release\bundle\nsis -File -Filter *.exe)
          if ($installers.Count -ne 1 -or $installers[0].Length -le 0) { throw "Exactly one non-empty NSIS installer is required" }
          Copy-Item $installers[0].FullName release\Wanxiang-Windows-x64-Setup.exe
          Get-ChildItem release -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content release\SHA256SUMS.txt -Encoding ascii

      - name: Verify installer version and signature state
        shell: pwsh
        run: |
          $config = Get-Content web\src-tauri\tauri.conf.json | ConvertFrom-Json
          $version = if ("${{ github.ref_type }}" -eq 'tag') { "${{ github.ref_name }}".TrimStart('v') } else { $config.version }
          if ($config.version -ne $version) {
            throw "Tag version $version does not match Tauri version $($config.version)"
          }
          $installer = Get-Item release\Wanxiang-Windows-x64-Setup.exe
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          "SIGNATURE_STATUS=$($signature.Status)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release/sbom.spdx.json
          upload-artifact: false

      - name: Attest installers
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/*.exe

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/*.exe
          sbom-path: release/sbom.spdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wanxiang-windows-${{ github.sha }}
          path: release/*
          if-no-files-found: error

      - name: Keep CI package as a candidate
        shell: pwsh
        run: |
          Write-Output 'CI artifacts are candidates. Publish only the exact installer that passed installed-app acceptance and the release evidence gate. Do not replace it with this rebuild.'

  accept-existing:
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_tag != ''
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      # GitHub only returns draft releases to writers. This job downloads
      # the candidate; it never creates, edits or publishes a release.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Download the exact accepted candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:EXPECTED_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'An exact candidate digest is required.' }
          gh release download $env:CANDIDATE_TAG --repo $env:GITHUB_REPOSITORY --pattern Wanxiang-Windows-x64-Setup.exe --dir acceptance-inputs
          if ((Get-FileHash -LiteralPath acceptance-inputs/Wanxiang-Windows-x64-Setup.exe).Hash -ne $env:EXPECTED_SHA256) { throw 'Candidate digest mismatch.' }
      - name: Install and verify first-run CPU and native media
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r requirements.txt
          python -m scripts.verify_clean_windows --installer acceptance-inputs/Wanxiang-Windows-x64-Setup.exe --sha256 $env:EXPECTED_SHA256 --output acceptance-output/clean-windows.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: clean-windows-acceptance-${{ github.sha }}
          path: acceptance-output/*
          if-no-files-found: error
