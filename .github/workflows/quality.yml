name: Quality Gate

on:
  push:
    branches: [main, clean-main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/workspace/runtime/playwright-browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m playwright install chromium
          .\.venv\Scripts\python.exe -c "from pathlib import Path; from app.runtime_packs import RuntimePackManager; RuntimePackManager(Path('runtime-packs.json'), Path('workspace/runtime')).install('ffmpeg-essentials-windows-x64')"
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\.venv\Scripts"
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\workspace\runtime\ffmpeg"

      - name: Verify frontend
        working-directory: web
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
          node node_modules/typescript/bin/tsc --noEmit
          npm run build

      - name: Verify backend and security contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          .\.venv\Scripts\python.exe -m unittest discover -s tests -p "test_*.py"
          node --test scripts/cf_worker_security.test.mjs

      - name: Verify desktop shell
        working-directory: web/src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Tauri validates configured resource paths during cargo check. The
          # release workflow replaces this empty directory with the built sidecar.
          New-Item -ItemType Directory -Force sidecar | Out-Null
          cargo check --locked
